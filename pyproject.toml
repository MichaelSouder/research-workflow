[project]
name = "qualtrics-automation"
version = "0.1.0"
description = "Qualtrics → Grid → Box pipeline with optional fraud detection and React/FastAPI UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boxsdk>=3,<4",
    "requests>=2.28",
    "mcp[cli]>=1.0",
    "itsdangerous>=2.2.0",
    "apscheduler>=3.11.2",
    "authlib>=1.6.9",
    "httpx>=0.28.1",
    "pymysql>=1.1.2",
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
backend = [
    "fastapi",
    "uvicorn[standard]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
